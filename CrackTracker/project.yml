name: CrackTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CrackTracker:
    type: application
    platform: iOS
    sources:
      - path: CrackTracker
    info:
      path: CrackTracker/Info.plist
      properties:
        CFBundleDisplayName: Crack Tracker
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cracktracker
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  CrackTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrackTrackerTests
    dependencies:
      - target: CrackTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cracktracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CrackTracker:
    build:
      targets:
        CrackTracker: all
        CrackTrackerTests: [test]
    test:
      targets:
        - CrackTrackerTests
